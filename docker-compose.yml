services:
  postgres:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_DB: novashop
      POSTGRES_USER: novashop
      POSTGRES_PASSWORD: novashop
    ports:
      - "5434:5432"     # tránh đụng cổng 5432/5433 mặc định trên máy dev
    volumes:
      - novashop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novashop -d novashop"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  novashop_pgdata:
